<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Estimate bulk electricity prices for large contracts from the latest ASX futures." />
    <title>Bulk Quote</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230f766e'/><path d='M18 5 9 18h6l-2 9 9-13h-6z' fill='white'/></svg>" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const t = JSON.parse(localStorage.getItem('bulk-quote') || '{}')?.state?.theme;
        const dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
