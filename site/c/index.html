<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HUMQuote</title>
    <script>
      // /c/ was version C, now version A. Before that it was version B (Bulk Quote),
      // so its links and share links (#/?..., #/compare, #/saved, #/market) go there.
      const toB = /^#\/(\?|compare|saved|market)/.test(location.hash);
      location.replace((toB ? "../b/" : "../a/") + location.search + location.hash);
    </script>
    <meta http-equiv="refresh" content="0; url=../a/" />
  </head>
  <body><a href="../a/">HUMQuote has moved here.</a></body>
</html>
