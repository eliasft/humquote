<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>HUMQuote - Bulk Electricity Pricing</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
    <style>
      body { margin: 0; background: #ffffff; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

      // App code lives next to this page in ./app/; the shared data and header image
      // are copied into ../data/ by the Pages deploy workflow.
      const appBase  = new URL("./", location.href);
      const dataBase = new URL("../data/", appBase);

      // Bust the browser cache roughly hourly so the daily data update shows up promptly.
      const cacheKey = Math.floor(Date.now() / 3_600_000);

      const pages = [
        "1_💲_Bulk Price Tracker.py",
        "2_📈_Futures Price Tracker.py",
      ];

      const files = {
        "HUM.py": { url: new URL("app/HUM.py", appBase).href },
        "futures_prices.db": { url: new URL(`futures_prices.db?v=${cacheKey}`, dataBase).href },
        "hum-solar-header.jpg": { url: new URL("hum-solar-header.jpg", dataBase).href },
      };
      for (const page of pages) {
        files[`pages/${page}`] = { url: new URL(`app/pages/${encodeURIComponent(page)}`, appBase).href };
      }

      mount(
        {
          entrypoint: "HUM.py",
          requirements: ["pandas", "numpy", "plotly", "xlsxwriter"],
          // Match the hosted Streamlit app: no developer "Deploy" button in the toolbar.
          streamlitConfig: { "client.toolbarMode": "viewer" },
          files,
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
