name: Option C checks

# Runs the parity tests and production build on pull requests, so problems
# show up before merging rather than in the Pages deploy.
on:
  pull_request:
    paths:
      - 'app-c/**'
      - '.github/workflows/app-c-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app-c

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: app-c/package-lock.json

    - name: Install
      run: npm ci

    - name: Parity tests
      run: npm test

    - name: Build
      run: npm run build
