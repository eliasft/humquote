name: Update ASX Futures Data

# ASX publishes each day's settlement at about 4:20 pm Sydney time. update_db.py
# works out which trading day the page's prices belong to from the clock, so a run
# at any time saves them under the right date; these times only decide how soon
# after settlement they arrive. GitHub often starts scheduled runs hours late, so
# there are three chances per trading day (times in UTC; Sydney is UTC+10, or
# UTC+11 in daylight saving):
on:
  schedule:
    - cron: '15 7 * * 1-5'   # 5:15 pm AEST / 6:15 pm AEDT, Mon–Fri
    - cron: '15 11 * * 1-5'  # 9:15 pm AEST / 10:15 pm AEDT, Mon–Fri (backup)
    - cron: '15 21 * * 0-4'  # 7:15 am AEST / 8:15 am AEDT, Mon–Fri: the previous trading day (backup)
  workflow_dispatch:  # Allows manual triggering from GitHub UI

# One update at a time: a delayed run waits for the previous one, then starts from
# its pushed data instead of racing it.
concurrency:
  group: update-futures-data
  cancel-in-progress: false

# The token only reads; the update is pushed with the DAILY_UPDATE_DEPLOY_KEY deploy key,
# which the "Protect main" ruleset lets push to main without a pull request.
permissions:
  contents: read

jobs:
  update-data:
    runs-on: ubuntu-26.04
    
    steps:
    # Step 1: Checkout the repository
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ssh-key: ${{ secrets.DAILY_UPDATE_DEPLOY_KEY }}
    
    # Step 2: Set up uv
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    # Step 3: Install Python (.python-version) and the packages pinned in uv.lock
    - name: Install dependencies
      run: uv sync --locked

    # Step 4: Run the data update script (fails the run if the page can't be read,
    # disagrees with the trading calendar, or no new prices have arrived for more
    # than a trading day)
    - name: Update futures data
      run: |
        uv run python update_db.py

    # Estimated CY prices for any dates with only FY strips (only the charts read them)
    - name: Rebuild CY estimates
      run: |
        uv run python .github/scripts/make_cy_estimates.py

    # Nothing is pushed if the data now has weekend, holiday or repeated dates
    - name: Check data quality
      run: |
        uv run python .github/scripts/check_futures_data.py data/asx_futures.csv

    # Step 5: Configure Git for committing
    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    # Step 6: Check for changes and commit
    - name: Commit and push changes
      run: |
        git add data/asx_futures.csv data/asx_futures_estimates.csv
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Automated update: ASX futures settlement $(tail -n 1 data/asx_futures.csv | cut -d, -f1)"
          git push
        fi