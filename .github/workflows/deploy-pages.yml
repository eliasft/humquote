name: Deploy GitHub Pages

# Publishes site/ (landing page and version A) plus the shared futures data and
# images, and builds version B (app-b/) into /b/ and the shared calculation core
# into /a/core.js, after the tests pass.
# The daily data commit is pushed with GITHUB_TOKEN, which doesn't trigger
# push events, so redeploy after each data update via workflow_run instead.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'app-b/**'
      - 'reference-data/**'
      - 'hum-solar-header.jpg'
      - 'logo_hum.png'
      - '.github/workflows/deploy-pages.yml'
      - '.github/scripts/export_futures_json.py'
  workflow_run:
    workflows: ['Update ASX Futures Data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: app-b/package-lock.json

    # The tests compare the calculations with the Python app (and check the
    # intended differences); a failure stops the deploy.
    - name: Test and build
      working-directory: app-b
      run: |
        npm ci
        npm test
        npm run build

    - name: Assemble site
      run: node app-b/scripts/assemble-site.mjs _site

    - name: Configure Pages
      uses: actions/configure-pages@v6

    - name: Upload site
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
