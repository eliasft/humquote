name: Deploy GitHub Pages

# Publishes site/ plus the shared futures database and header image.
# The daily data commit is pushed with GITHUB_TOKEN, which doesn't trigger
# push events, so redeploy after each data update via workflow_run instead.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'hum-solar-header.jpg'
      - '.github/workflows/deploy-pages.yml'
      - '.github/scripts/export_futures_json.py'
  workflow_run:
    workflows: ['Update ASX Futures Data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Assemble site
      run: |
        mkdir -p _site
        cp -r site/. _site/
        mkdir -p _site/data
        cp futures_prices.db hum-solar-header.jpg _site/data/
        python3 .github/scripts/export_futures_json.py futures_prices.db _site/data/futures.json

    - name: Configure Pages
      uses: actions/configure-pages@v6

    - name: Upload site
      uses: actions/upload-pages-artifact@v5
      with:
        path: _site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
