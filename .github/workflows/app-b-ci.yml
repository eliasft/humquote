name: Version B checks

# Runs the tests and production builds (version B and the shared core used by
# version A) on pull requests, so problems show up before merging rather than in
# the Pages deploy.
on:
  # Every pull request: test-and-build is a required check on main.
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app-b

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: app-b/package-lock.json

    - name: Install
      run: npm ci

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    # Fails if pyproject.toml and uv.lock disagree.
    - name: Python dependencies
      working-directory: .
      run: uv sync --locked

    # Rewrites the cases from the Streamlit app's Python core, so the tests below
    # check it still agrees with the web core.
    - name: Python core cases
      working-directory: .
      run: uv run python app-b/test/generate_core_cases.py

    - name: Tests
      run: npm test

    # ASX trading calendar and settlement-date rules, the futures history file's
    # reading/merging rules, and the data itself (no weekend, holiday or repeated dates)
    - name: Futures data checks
      working-directory: .
      run: |
        uv run python .github/scripts/test_asx_calendar.py
        uv run python .github/scripts/test_futures_store.py
        uv run python .github/scripts/check_futures_data.py data/asx_futures.csv

    - name: Build
      run: npm run build
