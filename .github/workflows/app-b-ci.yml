name: Version B checks

# Runs the tests and production builds (version B and the shared core used by
# version A) on pull requests, so problems show up before merging rather than in
# the Pages deploy.
on:
  pull_request:
    paths:
      - 'app-b/**'
      - 'reference-data/**'
      - 'site/**'
      - '.github/workflows/app-b-ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app-b

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: app-b/package-lock.json

    - name: Install
      run: npm ci

    - name: Parity tests
      run: npm test

    - name: Build
      run: npm run build
