name: Version B checks

# Runs the tests and production builds (version B and the shared core used by
# version A) on pull requests, so problems show up before merging rather than in
# the Pages deploy.
on:
  # Every pull request: test-and-build is a required check on main.
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: app-b

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'
        cache: npm
        cache-dependency-path: app-b/package-lock.json

    - name: Install
      run: npm ci

    # Rewrites the cases from the Streamlit app's Python core, so the tests below
    # check it still agrees with the web core.
    - name: Python core cases
      working-directory: .
      run: python3 app-b/test/generate_core_cases.py

    - name: Tests
      run: npm test

    - name: Build
      run: npm run build
