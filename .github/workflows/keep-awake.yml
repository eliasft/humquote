name: Keep Streamlit App Awake

# Streamlit Community Cloud hibernates apps after 12 hours without traffic, so this
# runs every 6 hours to leave room for GitHub's scheduled runs being delayed or
# dropped. Minute 17 avoids the congested top of the hour.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:  # Allows manual triggering from GitHub UI

# Read-only: unlike update-futures-data.yml, this workflow never commits.
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Playwright
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install --with-deps chromium

    - name: Visit the app
      env:
        APP_URL: https://humquote.streamlit.app
      run: python scripts/keep_awake.py

    - name: Upload failure screenshot
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: keep-awake-failure
        path: |
          keep_awake_failure.png
          keep_awake_failure.html
        retention-days: 7
        if-no-files-found: ignore
