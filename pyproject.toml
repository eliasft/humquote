[project]
name = "humquote"
version = "1.0.0"
description = "HUMQuote: bulk electricity pricing app (Streamlit) and the daily ASX futures update"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.50.0",
    "pandas>=2.2.0",
    "numpy>=2.0.0",
    "beautifulsoup4>=4.12.0",   # ASX page scraping (update_db.py)
    "requests>=2.32.0",
    "tzdata>=2024.1",           # Sydney time zone for the ASX calendar (Windows has no system copy)
    "plotly>=5.24.0",
    "xlsxwriter>=3.2.0",        # Excel export
    "fpdf2>=2.8.0",             # PDF quote sheet
]

# An app, not a library: uv installs the dependencies only.
[tool.uv]
package = false
